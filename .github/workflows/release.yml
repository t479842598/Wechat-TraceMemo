name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    env:
      # 覆盖 electron-builder.yml 中指向上游 Wxw-Gu/WechatExplorer 的 publish 配置，
      # 使产物发布到本 fork 仓库 t479842598/Wechat-TraceMemo。
      GH_OWNER: t479842598
      GH_REPO: Wechat-TraceMemo
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # electron-builder 需要 CSC_LINK/CSC_KEY_PASSWORD 才会做 macOS 代码签名；
      # 缺省时不签名也能打包 dmg（notarize: false），保留为可选 secrets。
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 7.33.7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/wechat-connector/go.mod
          cache-dependency-path: services/wechat-connector/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build & publish (Windows x64)
        if: runner.os == 'Windows'
        run: pnpm build:win

      - name: Build & publish (macOS x64)
        if: runner.os == 'macOS'
        run: pnpm build:mac:x64

      - name: Build & publish (macOS arm64)
        if: runner.os == 'macOS'
        run: pnpm build:mac:arm64

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: ignore
          retention-days: 30
